<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Harvest</title>
    <meta name="description" content="Harvest is a local-first productivity app: habits, projects and to-dos as seeds on a field, a streak, notes and a granary for money." />
    <meta name="theme-color" content="#1F8A46" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Paint the right theme before React loads, so a dark-mode reader
      // never sees a cream flash. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('harvest.themeMode') || 'system';
          var preset = localStorage.getItem('harvest.themePreset') || 'harvest';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.preset = preset;
          var lang = localStorage.getItem('harvest.locale');
          if (lang === 'ar') { root.lang = 'ar'; root.dir = 'rtl'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Harvest needs JavaScript to run in a browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
