# Harvest before it has a certificate: only the ACME challenge, and a
# holding page. deploy.sh replaces it with harvest.https.conf once
# Let's Encrypt has answered.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
    }

    location / {
        return 503 "Harvest is being set up.\n";
    }
}
