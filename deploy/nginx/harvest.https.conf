# Harvest on one origin (deploy.sh writes this, filled in, to
# /etc/nginx/sites-available/harvest): the web app as static files, /v1
# to the sync server on the loopback ([[Deployment]]).

# Plain http: the ACME challenge for renewals, everything else to https.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

__WWW_REDIRECT__

server {
    listen 443 ssl__H2_LISTEN__;
    listen [::]:443 ssl__H2_LISTEN__;
    __H2_DIRECTIVE__
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:harvest_tls:10m;
    ssl_session_timeout 1d;

    root __WEB_ROOT__;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # The sync server. Pictures and recordings go up to 25 MB a file, a
    # recording to transcribe about 15 MB, so the door is wider than
    # nginx's 1 MB default.
    location /v1/ {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        include snippets/harvest-headers.conf;
    }

    # The assist answers as server-sent events: pass each piece on as it
    # comes instead of holding the answer back.
    location /v1/assist {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        include snippets/harvest-headers.conf;
    }

    # Source maps stay on the build machine.
    location ~ \.map$ {
        return 404;
    }

    # Hashed assets never change. A missing one is a 404, never the app's
    # page cached for a year under a script's name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/harvest-headers.conf;
    }

    # Everything else is the shell, asked for again every time, or a
    # deploy never reaches an open tab; a path that is not a file is a
    # page of the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/harvest-headers.conf;
    }
}
