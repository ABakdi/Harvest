# Headers every Harvest response carries (deploy.sh installs this as
# /etc/nginx/snippets/harvest-headers.conf). nginx drops a server's
# add_header lines in any location that sets its own, so each location
# includes this snippet rather than relying on inheritance.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
# Map tiles and fonts (OpenFreeMap), satellite tiles (Esri), the rates I
# ask for; nothing else leaves the page (Business rule 13).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://server.arcgisonline.com https://api.frankfurter.dev; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
