name: harvest
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.6+6

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  home_widget: ^0.9.4
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  meta: ^1.19.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.6
  table_calendar: ^3.2.1
  timezone: ^0.11.1
  uuid: ^4.6.0
  workmanager: ^0.10.9

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.8
  very_good_analysis: ^10.3.0
flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
